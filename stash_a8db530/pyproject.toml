[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qyntara-core"
version = "5.0.0"
description = "The world's first Spatial Intelligence Operating System - DCC-agnostic 3D asset pipeline infrastructure"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Dass2023", email = "dass2023@qyntara.ai"}
]
keywords = ["3d", "spatial-computing", "dcc", "maya", "blender", "3dsmax", "unity", "unreal", "gltf", "usd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"

dependencies = [
    "numpy>=1.20.0",
    "packaging>=20.0",
]

[project.optional-dependencies]
usd = ["usd-core>=22.11"]
scipy = ["scipy>=1.7.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
]
all = [
    "qyntara-core[usd,scipy,dev]"
]

[project.urls]
Homepage = "https://github.com/Dass2023/Qyntara-AI"
Documentation = "https://qyntara.ai/docs"
Repository = "https://github.com/Dass2023/Qyntara-AI"
"Bug Tracker" = "https://github.com/Dass2023/Qyntara-AI/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["qyntara_core*", "qyntara_dcc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
