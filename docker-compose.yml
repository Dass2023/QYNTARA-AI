services:
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    ports: [ "8000:8000" ]
    volumes: [ ./backend:/app/backend ]
    environment:
      - PYTHONUNBUFFERED=1
      - ADMIN_KEY
      - SECRET_KEY
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - redis
      - qdrant

  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: celery -A backend.tasks.celery_app worker --loglevel=info --concurrency=1
    volumes: [ ./backend:/app/backend ]
    environment:
      - PYTHONUNBUFFERED=1
      - ADMIN_KEY
      - SECRET_KEY
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - redis
      - qdrant

  redis:
    image: redis:7-alpine
    ports: [ "6379:6379" ]

  qdrant:
    image: qdrant/qdrant:latest
    ports: [ "6333:6333" ]
    volumes: [ ./data/qdrant_storage:/qdrant/storage ]

  jenkins:
    image: jenkins/jenkins:lts
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - ./data/jenkins_home:/var/jenkins_home
    user: root

networks:
  default:
    driver: bridge
